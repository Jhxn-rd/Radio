7+B2/elSogORFC0UUgByNWCDyOKVKlSRLP//Z);
    background-repeat:no-repeat, no-repeat, no-repeat;
    background-position:center top, center top, center center;
    background-size:auto, auto, cover;
    background-attachment:fixed, fixed, fixed;
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    line-height:1.6;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--on-dark);}
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    /* keep looping decorative motion (pulsing dot, equalizer bars) still;
       but let one-shot UI transitions (like the category accordion) run
       at a normal, perceivable speed so opening/closing stays visible */
    *{animation-duration:.001ms !important;}
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:12px;
  }
  .station-id{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .station-id img{
    width:30px; height:30px;
    border-radius:50%;
    box-shadow:0 0 0 1px var(--line);
  }
  .station-id .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--live);
    box-shadow:0 0 0 0 rgba(255,255,255,.55);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,.5);}
    70%{box-shadow:0 0 0 8px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }
  .ep-count{
    font-size:12.5px;
    color:var(--text-dim);
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:64px 28px 40px;
    text-align:center;
    background:
      radial-gradient(ellipse 60% 60% at 50% 0%, rgba(255,255,255,0.08), transparent 65%);
    overflow:hidden;
  }
  .hero > *{ position:relative; z-index:1; }
  .on-air{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 16px;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:22px;
    letter-spacing:0.03em;
  }
  .on-air .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--live);
    animation:pulse 2s infinite;
  }
  .hero p.tagline{
    color:var(--text-dim);
    max-width:520px;
    margin:0 auto 30px;
    font-size:15.5px;
  }
  .hero-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--on-dark);
    border:none;
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:14.5px;
    padding:13px 26px;
    border-radius:8px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-primary:hover{ background:#e6ecf7; transform:translateY(-1px); }
  .btn-primary svg{ width:16px; height:16px; }

  .search-wrap{
    max-width:440px;
    margin:32px auto 0;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:13px 44px 13px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    font-size:14.5px;
  }
  .search-wrap input::placeholder{ color:var(--text-dim); }
  .search-wrap svg{
    position:absolute; right:15px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; stroke:var(--text-dim); pointer-events:none;
  }

  /* ---------- Dial (shows) ---------- */
  .dial{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:26px 28px 4px;
    max-width:1080px;
    margin:0 auto;
    scrollbar-width:thin;
  }
  .dial::-webkit-scrollbar{ height:5px; }
  .dial::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:4px; }
  .dial button{
    flex:none;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .dial button:hover{ color:var(--text); border-color:var(--accent-deep); }
  .dial button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--on-dark);
  }


  .resume-banner{
    max-width:1080px;
    margin:0 auto 18px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:13px;
    color:var(--text-dim);
  }
  .resume-banner span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .resume-banner button{
    font-family:'Tajawal', sans-serif;
    font-size:12.5px;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
    flex:none;
  }
  .resume-banner #resumeBtn{
    background:var(--accent);
    color:var(--on-dark);
    border:none;
    padding:7px 14px;
  }
  .resume-banner #resumeDismiss{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    width:28px; height:28px;
  }

  .related-section{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px 18px;
  }
  .related-section .related-label{
    font-size:12.5px;
    color:var(--text-dim);
    margin:0 0 8px;
  }
  .related-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .related-chips button{
    font-family:'Tajawal', sans-serif;
    font-size:12.5px;
    text-align:right;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    max-width:280px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .related-chips button:hover{ border-color:var(--accent-deep); }

  #dock.no-source .live-dot{ animation-play-state:paused; opacity:.35; }
  .ep-share{
    flex:none;
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    padding:4px;
    opacity:.6;
  }
  .ep-share:hover{ opacity:1; color:var(--text); }

  /* ---------- Episode list ---------- */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:24px 28px 120px;
  }
  .show-block{ margin-bottom:16px; border-bottom:1px solid var(--line); }
  .show-head{
    font-family:'Tajawal', sans-serif;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0;
    padding:16px 10px;
    cursor:pointer;
    user-select:none;
    transition:background .12s ease;
  }
  .show-head:hover{ background:var(--surface); }
  .show-head .show-head-main{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }
  .show-head h2{
    font-family:'Tajawal', sans-serif;
    font-size:16px;
    font-weight:800;
    margin:0;
  }
  .show-head span{
    font-family:'Tajawal', sans-serif;
    font-size:12px;
    color:var(--text-dim);
    flex:none;
  }
  .show-head .chevron{
    flex:none;
    width:18px; height:18px;
    color:var(--text-dim);
    transition:transform .28s ease;
  }
  .show-block.open .show-head .chevron{ transform:rotate(180deg); }

  .show-wrap{
    height:0;
    overflow:hidden;
    transition:height .4s cubic-bezier(.4,0,.2,1);
  }
  .show-body{ padding-bottom:8px; }

  .ep-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 10px;
    border-radius:8px;
    cursor:pointer;
    opacity:0;
    transform:translateY(-8px);
    transition:background .12s ease, opacity .3s ease, transform .3s ease;
  }
  .show-block.open .ep-row{ opacity:1; transform:translateY(0); }
  .ep-row:hover{ background:var(--surface); }
  .ep-row.playing{ background:var(--surface-2); }

  .ep-play{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    transition:background .12s ease;
  }
  .ep-row:hover .ep-play, .ep-row.playing .ep-play{ background:var(--accent); color:var(--on-dark); }
  .ep-play svg{ width:13px; height:13px; }

  .ep-title{
    flex:1;
    min-width:0;
    font-size:14.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ep-row.playing .ep-title{ color:var(--accent); font-weight:700; }

  .ep-dur{
    flex:none;
    font-size:12.5px;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }

  .no-results{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
    font-size:15px;
  }

  /* ---------- Now playing dock ---------- */
  #dock{
    position:fixed;
    bottom:16px; left:50%; right:auto;

  .brand-logo{
    display:block;
    width:138px;
    height:auto;
    max-height:58px;
    object-fit:contain;
    object-position:center;
  }
  .hero-brand{
    margin-bottom:20px;
    justify-content:center;
  }
  .hero-logo{
    display:block;
    width:min(290px,72vw);
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 12px 34px rgba(0,240,143,.08));
  }
  @media (max-width:640px){
    .brand-logo{width:118px;max-height:50px;}
    .hero-logo{width:min(250px,72vw);}
  }

  :root{
    --accent:#00f08f;
    --accent-bright:#18e9aa;
  }

  /* تصنيفات صوتية أقصر وأكثر تماسكًا */
  .dial button{padding:8px 12px;font-size:13px;}
  @media (max-width:640px){.dial button{padding:7px 10px;font-size:12.5px;}}


  @media(max-width:700px){
    .dock-inner{flex-wrap:wrap; gap:10px;}
    .dock-frame{order:4; width:100%;}
    .dock-info{min-width:calc(100% - 110px);}
  }

</style>

const dial = document.getElementById('dial');
const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
const dock = document.getElementById('dock');
const dAudio = document.getElementById('dAudio');
const dPlay = document.getElementById('dPlay');
const dBack = document.getElementById('dBack');
const dForward = document.getElementById('dForward');
const dProgress = document.getElementById('dProgress');
const dCurrent = document.getElementById('dCurrent');
const dDuration = document.getElementById('dDuration');
const dSpeed = document.getElementById('dSpeed');
const dMute = document.getElementById('dMute');
const dVolume = document.getElementById('dVolume');
const dTitle = document.getElementById('dTitle');
const dShow = document.getElementById('dShow');
const dClose = document.getElementById('dClose');
const dText = document.getElementById('dText');
const dockInfo = document.querySelector('.dock-info');
const transcriptOverlay = document.getElementById('transcriptOverlay');
const tTitle = document.getElementById('tTitle');
const tShow = document.getElementById('tShow');
const tBody = document.getElementById('tBody');
const tClose = document.getElementById('tClose');
const epCountTop = document.getElementById('epCountTop');
const playLatestBtn = document.getElementById('playLatest');
const relatedSection = document.getElementById('relatedSection');
const resumeBanner = document.getElementById('resumeBanner');
const resumeText = document.getElementById('resumeText');
const resumeBtn = document.getElementById('resumeBtn');
const resumeDismiss = document.getElementById('resumeDismiss');

let activeShow = 'all';
let query = '';
let playingIdx = null;
let openShows = new Set();

function slugForShare(idx){
  return location.origin + location.pathname + '#ep-' + idx;
}

function renderRelated(idx){
  const e = EPISODES[idx];
  const others = EPISODES
    .map((ep, i) => ({...ep, i}))
    .filter(ep => ep.show === e.show && ep.i !== idx)
    .slice(0, 3);
  if(others.length === 0){
    relatedSection.style.display = 'none';
    relatedSection.innerHTML = '';
    return;
  }
  relatedSection.style.display = 'block';
  relatedSection.innerHTML = `<p class="related-label">قد يعجبك أيضًا من «${e.show}»</p><div class="related-chips"></div>`;
  const chipsWrap = relatedSection.querySelector('.related-chips');
  others.forEach(ep => {
    const chip = document.createElement('button');
    chip.textContent = ep.title;
    chip.addEventListener('click', () => play(ep.i));
    chipsWrap.appendChild(chip);
  });
}

function initResumeBanner(){
  let lastIdx = null;
  try{ lastIdx = localStorage.getItem('marwan_last_played'); }catch(err){}
  if(lastIdx === null || !EPISODES[Number(lastIdx)]) return;
  const idx = Number(lastIdx);
  if(idx === playingIdx) return;
  resumeText.textContent = 'أكمل الاستماع إلى: ' + EPISODES[idx].title;
  resumeBanner.style.display = 'flex';
  resumeBtn.onclick = () => { resumeBanner.style.display = 'none'; play(idx); document.getElementById('dock').scrollIntoView({behavior:'smooth', block:'end'}); };
  resumeDismiss.onclick = () => { resumeBanner.style.display = 'none'; };
}

function shareIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>';
}

function copyEpisodeLink(idx, btn){
  const url = slugForShare(idx);
  const done = () => {
    const old = btn.title;
    btn.title = 'تم نسخ الرابط';
    setTimeout(() => { btn.title = old; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(() => window.prompt('انسخ الرابط:', url));
  }else{
    window.prompt('انسخ الرابط:', url);
  }
}

function chevronIcon(){
  return '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
}

epCountTop.textContent = `${EPISODES.length} حلقة`;

function playIcon(){
  return '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>';
}

function renderDial(){
  dial.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'كل البرامج';
  allBtn.className = activeShow === 'all' ? 'active' : '';
  allBtn.addEventListener('click', () => { activeShow = 'all'; renderDial(); renderList(); });
  dial.appendChild(allBtn);

  SHOWS.forEach(s => {
    const btn = document.createElement('button');
    btn.textContent = s;
    btn.className = activeShow === s ? 'active' : '';
    btn.addEventListener('click', () => { activeShow = s; openShows.add(s); renderDial(); renderList(); });
    dial.appendChild(btn);
  });
}

function renderList(){
  main.innerHTML = '';
  const q = query.trim().toLowerCase();
  const shows = activeShow === 'all' ? SHOWS : [activeShow];
  let any = false;

  shows.forEach(showName => {
    const eps = EPISODES
      .map((e, idx) => ({...e, idx}))
      .filter(e => {
        if(e.show !== showName) return false;
        if(q !== ''){
          const inTitle = e.title.toLowerCase().includes(q);
          const inTranscript = (e.transcript || '').toLowerCase().includes(q);
          if(!inTitle && !inTranscript) return false;
        }
        return true;
      });

    if(eps.length === 0) return;
    any = true;

    const isOpen = openShows.has(showName) || q !== '';

    const block = document.createElement('section');
    block.className = 'show-block' + (isOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'show-head';
    head.setAttribute('tabindex', '0');
    head.setAttribute('role', 'button');
    head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    head.innerHTML = `
      <span class="show-head-main"><h2>${showName}</h2><span>${eps.length} حلقة</span></span>
      ${chevronIcon()}
    `;

    const wrap = document.createElement('div');
    wrap.className = 'show-wrap';

    const body = document.createElement('div');
    body.className = 'show-body';

    eps.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'ep-row' + (playingIdx === e.idx ? ' playing' : '');
      row.style.transitionDelay = isOpen ? '0ms' : Math.min(i * 35, 280) + 'ms';
      row.setAttribute('tabindex', '0');
      row.setAttribute('role', 'button');
      row.innerHTML = `
        <span class="ep-play">${playIcon()}</span>
        <span class="ep-title">${e.title}</span>
        <span class="ep-dur">${e.duration}</span>
        <button class="ep-share" title="نسخ رابط الحلقة" aria-label="نسخ رابط الحلقة">${shareIcon()}</button>
      `;
      row.addEventListener('click', (ev) => { ev.stopPropagation(); play(e.idx); });
      row.addEventListener('keypress', (ev) => { if(ev.key === 'Enter'){ ev.stopPropagation(); play(e.idx); } });
      row.querySelector('.ep-share').addEventListener('click', (ev) => {
        ev.stopPropagation();
        copyEpisodeLink(e.idx, ev.currentTarget);
      });
      body.appendChild(row);
    });

    function toggle(){
      const willOpen = !openShows.has(showName);
      const rows = Array.from(body.querySelectorAll('.ep-row'));
      head.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      block.classList.toggle('open', willOpen);

      if(willOpen){
        openShows.add(showName);
        // cascade the rows in, one after another
        rows.forEach((row, i) => { row.style.transitionDelay = Math.min(i * 35, 280) + 'ms'; });
        // animate the panel from 0 up to its natural content height
        wrap.style.height = wrap.scrollHeight + 'px'; // starting point (0, but forces a layout read)
        const target = body.scrollHeight;
        requestAnimationFrame(() => { wrap.style.height = target + 'px'; });
        wrap.addEventListener('transitionend', function onEnd(ev){
          if(ev.propertyName !== 'height') return;
          wrap.removeEventListener('transitionend', onEnd);
          if(openShows.has(showName)) wrap.style.height = 'auto'; // let it breathe if content changes later
        });
      }else{
        openShows.delete(showName);
        // fade the rows out in reverse, so the bottom of the list disappears first
        const n = rows.length;
        rows.forEach((row, i) => { row.style.transitionDelay = Math.min((n - 1 - i) * 25, 180) + 'ms'; });
        // pin the panel to its current pixel height first (it may be 'auto'),
        // force a reflow, then collapse to 0 on the next frame so the
        // transition has a real, concrete starting value to animate from
        wrap.style.height = wrap.scrollHeight + 'px';
        void wrap.offsetHeight; // force reflow
        requestAnimationFrame(() => { wrap.style.height = '0px'; });
      }
    }
    head.addEventListener('click', toggle);
    head.addEventListener('keypress', (ev) => { if(ev.key === 'Enter') toggle(); });

    wrap.appendChild(body);
    block.appendChild(head);
    block.appendChild(wrap);
    main.appendChild(block);

    if(isOpen){
      // already-open on mount (e.g. from a search match) — no animation
      // needed here, just make sure the content isn't clipped at height 0
      wrap.style.height = 'auto';
    }
  });

  if(!any){
    main.innerHTML = '<div class="no-results">ما لقيناش حلقة بهاد الاسم.</div>';
  }
}

const SPEEDS=[0.75,1,1.25,1.5,1.75,2]; let speedIndex=1;
function formatTime(seconds){if(!Number.isFinite(seconds)||seconds<0)return '0:00';seconds=Math.floor(seconds);const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function updatePlayerUI(){const duration=dAudio.duration,current=dAudio.currentTime||0;dCurrent.textContent=formatTime(current);dDuration.textContent=formatTime(duration);const pct=Number.isFinite(duration)&&duration>0?(current/duration)*100:0;dProgress.value=pct;dProgress.style.setProperty('--progress',pct+'%');dPlay.textContent=dAudio.paused?'▶':'Ⅱ';dPlay.title=dAudio.paused?'تشغيل':'إيقاف مؤقت';dPlay.setAttribute('aria-label',dPlay.title);dMute.innerHTML=(dAudio.muted||dAudio.volume===0)?'<svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9l5 6m0-6-5 6"/></svg>':'<svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="wave wave1" d="M16 9.5c1 1.4 1 3.6 0 5"/><path class="wave wave2" d="M18.5 7c2.3 2.8 2.3 7.2 0 10"/></svg>';}
dPlay.addEventListener('click',()=>{if(dAudio.paused)dAudio.play().catch(()=>{});else dAudio.pause();});dBack.addEventListener('click',()=>{dAudio.currentTime=Math.max(0,dAudio.currentTime-10);});dForward.addEventListener('click',()=>{dAudio.currentTime=Math.min(Number.isFinite(dAudio.duration)?dAudio.duration:dAudio.currentTime+10,dAudio.currentTime+10);});dProgress.addEventListener('input',()=>{if(Number.isFinite(dAudio.duration)&&dAudio.duration>0)dAudio.currentTime=(Number(dProgress.value)/100)*dAudio.duration;dProgress.style.setProperty('--progress',dProgress.value+'%');});dSpeed.addEventListener('click',()=>{speedIndex=(speedIndex+1)%SPEEDS.length;dAudio.playbackRate=SPEEDS[speedIndex];dSpeed.textContent=SPEEDS[speedIndex]+'×';});dMute.addEventListener('click',()=>{dAudio.muted=!dAudio.muted;updatePlayerUI();});dVolume.addEventListener('input',()=>{dAudio.volume=Number(dVolume.value);dAudio.muted=dAudio.volume===0;updatePlayerUI();});['loadedmetadata','timeupdate','durationchange','play','pause','volumechange','ended','error'].forEach(ev=>dAudio.addEventListener(ev,updatePlayerUI));

function play(idx){
  const e = EPISODES[idx];
  playingIdx = idx;
  openShows.add(e.show);
  const hasSource = !!e.audioUrl;
  dAudio.pause();
  dAudio.src = hasSource ? e.audioUrl : '';
  dAudio.load();
  dAudio.playbackRate=SPEEDS[speedIndex]; dSpeed.textContent=SPEEDS[speedIndex]+'×'; dProgress.value=0; dProgress.style.setProperty('--progress','0%'); updatePlayerUI();
  if(hasSource){
    dAudio.play().catch(() => {});
  }
  dTitle.textContent = e.title;
  dShow.textContent = hasSource ? (e.show + ' · ' + e.duration) : (e.show + ' · ملف MP3 غير متوفر بعد');
  dock.classList.add('open');
  dock.classList.toggle('no-source', !hasSource);
  document.body.style.paddingBottom = '90px';
  try{ localStorage.setItem('marwan_last_played', String(idx)); }catch(err){}
  if(history.replaceState) history.replaceState(null, '', '#ep-' + idx);
  renderRelated(idx);
  renderList();
}

dClose.addEventListener('click', () => {
  dAudio.pause();
  dAudio.removeAttribute('src');
  dAudio.load();
  dock.classList.remove('open');
  dock.classList.remove('no-source');
  playingIdx = null;
  document.body.style.paddingBottom = '0';
  relatedSection.style.display = 'none';
  if(history.replaceState) history.replaceState(null, '', location.pathname);
  renderList();
  closeTranscript();
});

function openTranscript(){
  if(playingIdx === null) return;
  const e = EPISODES[playingIdx];
  tTitle.textContent = e.title;
  tShow.textContent = e.show + ' · ' + e.duration;
  const text = (e.transcript || '').trim();
  if(text){
    tBody.textContent = text;
    tBody.classList.remove('empty');
  }else{
    tBody.textContent = 'النص المقروء في هذه الصوتية غير متوفر بعد.';
    tBody.classList.add('empty');
  }
  transcriptOverlay.classList.add('open');
}
function closeTranscript(){
  transcriptOverlay.classList.remove('open');
}
dText.addEventListener('click', (ev) => { ev.stopPropagation(); openTranscript(); });
dockInfo.addEventListener('click', openTranscript);
tClose.addEventListener('click', closeTranscript);
transcriptOverlay.addEventListener('click', (ev) => { if(ev.target === transcriptOverlay) closeTranscript(); });
document.addEventListener('keydown', (ev) => { if(ev.key === 'Escape') closeTranscript(); });

searchInput.addEventListener('input', (e) => { query = e.target.value; renderList(); });
playLatestBtn.addEventListener('click', () => play(0));

renderDial();
renderList();

(function bootFromHash(){
  const m = location.hash.match(/^#ep-(\d+)$/);
  if(m && EPISODES[Number(m[1])]){
    const idx = Number(m[1]);
    openShows.add(EPISODES[idx].show);
    renderList();
    play(idx);
  } else {
    initResumeBanner();
  }
})();
</script>
